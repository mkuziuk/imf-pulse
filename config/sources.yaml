version: 1

roots:
  imf:
    live_path_env: IMF_SOURCE_ROOT
    default_live_path: ../imf
    snapshot_root: imports/imf
    access: read_only

policy:
  explicit_allowlist_only: true
  reject_absolute_paths: true
  reject_parent_segments: true
  reject_symlinks: true
  reject_path_escapes: true
  require_regular_files: true
  hash_algorithm: sha256
  execute_source_code: false
  external_monitoring:
    enabled: true
    configuration: config/external-sources.yaml
  public_reuse_requires_approval: true

sources:
  - id: src-imf-draft
    root: imf
    path: IMF.pdf
    title: Intrinsic robust multiscale filtering draft
    authors: [Vladimir Spokoiny]
    date: "2026-07-03"
    source_type: internal_theory_draft
    authority_level: internal_unverified
    publication_status: unpublished
    topics: [imf, irmf, signal-decomposition, linear-filtering, robust-local-estimation, theoretical-gaps]
    extractor: pdf-pages-v1
    required: true
    rights: &internal_rights
      license: unknown
      reuse_status: internal_only
      public_distribution: false
    limitations:
      - PDF metadata fields are blank; the visible title page supplies the author and date.
      - This unfinished internal draft contains incomplete and unproved statements and is not ground truth.

  - id: src-repo-readme
    root: imf
    path: README.md
    title: IMF research repository overview
    authors: []
    date: null
    source_type: technical_documentation
    authority_level: internal_unverified
    publication_status: unpublished
    topics: [imf, irmf, signal-decomposition, robust-local-estimation, robustness-parameter]
    extractor: text-lines-v1
    required: true
    rights: *internal_rights
    limitations:
      - Repository documentation describes current implementations but is not peer reviewed.

