name: Verify and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the reviewed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Select the verification scope
        id: verification
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          scope="$(python scripts/classify_pages_change.py --event "$EVENT_NAME" --before "$BEFORE_SHA" --after "$AFTER_SHA")"
          test "$scope" = "full" || test "$scope" = "content"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

      - name: Install locked application dependencies
        run: npm ci

      - name: Install pinned pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify the public release boundary
        run: python scripts/audit_public_release.py --directory public-release

      - name: Run pipeline tests
        if: steps.verification.outputs.scope == 'full'
        run: python -m pytest -q -n 2

      - name: Confirm the content-only fast path
        if: steps.verification.outputs.scope == 'content'
        run: echo "Full pipeline tests already passed inside the guarded daily transaction."

      - name: Run frontend tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the reviewed public release
        env:
          IMF_PULSE_PUBLIC_RELEASE_DIR: public-release
          VITE_BASE_PATH: /imf-pulse/
          VITE_ROUTER_MODE: hash
        run: npm run build

      - name: Reject public source maps
        run: |
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Public builds must not contain source maps." >&2
            exit 1
          fi

      - name: Upload the verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
