<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">The residual changes direction</title><desc id="desc">A project-generated diagram of the MdMvFIF alternation: spatial extraction changes the residual seen by temporal extraction, and the updated residual returns to the outer loop.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#d64f37"/></marker></defs><rect width="1200" height="480" fill="#f3efe7"/><text x="70" y="75" font-family="Georgia,serif" font-size="34" fill="#171816">A decomposition with two directions</text><line x1="70" y1="100" x2="1130" y2="100" stroke="#171816" stroke-width="1"/><line x1="245.0" y1="240.0" x2="355.0" y2="240.0" stroke="#d64f37" stroke-width="3" marker-end="url(#arrow)"/><text x="300.0" y="216.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#62635f">estimate shared support</text><line x1="545.0" y1="240.0" x2="655.0" y2="240.0" stroke="#d64f37" stroke-width="3" marker-end="url(#arrow)"/><text x="600.0" y="216.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#62635f">subtract spatial IMF</text><line x1="845.0" y1="240.0" x2="955.0" y2="240.0" stroke="#d64f37" stroke-width="3" marker-end="url(#arrow)"/><text x="900.0" y="216.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#62635f">subtract temporal IMF</text><rect x="50.0" y="176.0" width="200" height="128" rx="4" fill="#fbfaf6" stroke="#171816" stroke-width="2"/><text x="150.0" y="240.0" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#171816"><tspan x="150.0" dy="0">Space-time data cube</tspan></text><rect x="350.0" y="176.0" width="200" height="128" rx="4" fill="#fbfaf6" stroke="#171816" stroke-width="2"/><text x="450.0" y="240.0" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#171816"><tspan x="450.0" dy="0">Spatial FIF extraction</tspan></text><rect x="650.0" y="176.0" width="200" height="128" rx="4" fill="#fbfaf6" stroke="#171816" stroke-width="2"/><text x="750.0" y="228.0" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#171816"><tspan x="750.0" dy="0">Temporal MvFIF</tspan><tspan x="750.0" dy="26">extraction</tspan></text><rect x="950.0" y="176.0" width="200" height="128" rx="4" fill="#fbfaf6" stroke="#171816" stroke-width="2"/><text x="1050.0" y="228.0" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#171816"><tspan x="1050.0" dy="0">Updated residual and</tspan><tspan x="1050.0" dy="26">repeat</tspan></text><text x="70" y="420" font-family="Arial,sans-serif" font-size="16" fill="#62635f">Project diagram; research evidence remains in the cited paper.</text></svg>