<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">A narrower fraction can still contain more observations</title>
  <desc id="description">A normalized log-scale line plot showing that under h proportional to n to the minus one fifth, the bandwidth fraction declines while the number of observations in the local window grows as n to the four fifths.</desc>
