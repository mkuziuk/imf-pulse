<title id="chart-title">The first stage is not the same filter</title>
<desc id="chart-description">Line chart across IMF stages one through nine. Exact single-pass scaled RMS stays close to 0.0203. Exact recursive scaled RMS starts at 0.0202 at stage one and falls to a stages two through nine mean of 0.00678. The stored seed-777 recursive realization follows the same pattern. Stage one has DC gain one; later recursive stages have DC gain zero.</desc>
