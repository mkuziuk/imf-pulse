  - id: benchmark-08-results-without-contamination
    question: Which results survive without contamination?
    answer: >-
      With p=0 but Gaussian noise retained, the large scaled first recursive error survives exactly in the linear operator profile: stage 1 is 0.0201816 versus a stages-2–9 mean of 0.0067761, ratio 2.978. It also survives robustification across 120 Gaussian-only trials: stage 1 averages 0.0188072 versus a later mean of 0.0066272, ratio 2.838. The single-pass-versus-recursive distinction, cumulative importance of prior residual filters, and failure of bandwidth scaling to calibrate sup error also survive. What does not follow is that robust filtering generally outperforms linear filtering on clean Gaussian data or that the result is a universal robust theorem.
    knowledge_ids:
      - claim-stage-one-pattern-survives-no-contamination
      - relationship-robust-mc-supports-no-contamination
    evidence:
      - source_id: src-diagnostics-summary
        locator: research/first-imf-recursive-error/diagnostics/summary.json, /linear_exact and /robust_mc
      - source_id: src-linear-operator-exact
        locator: research/first-imf-recursive-error/diagnostics/linear_operator_exact.csv, rows 2–10
      - source_id: src-robust-monte-carlo
        locator: research/first-imf-recursive-error/diagnostics/robust_monte_carlo.csv, rows 2–10
    confidence:
      level: high
      score: 0.97
      rationale: Exact linear and repeated robust Gaussian-only evidence agree for this setup.
    gaps:
      - Robust Monte Carlo fixes one signal, n, sigma, H, schedule, and boundary.
      - No paired repeated linear-versus-robust Gaussian efficiency study is present.

  - id: benchmark-09-incomplete-theory
