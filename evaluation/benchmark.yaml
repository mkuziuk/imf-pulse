questions:
  - id: benchmark-01-imf-vs-irmf
    question: What distinguishes IMF and IRMF in this project?
    answer: >-
      Both use the same sequential multiscale recursion: fit a local component to the current residual, record it, subtract it, and then move to a smaller window. In repository usage, linear IMF uses quadratic loss and therefore a normalized kernel-weighted mean with fixed W operators. The robust variant associated with the gd-irmf/IRMF naming uses the smooth rho_H loss with bounded erf score and solves a nonlinear local location problem by gradient descent. Fixed-matrix commutativity and exact operator-energy calculations therefore apply to the linear method, not directly to robust IRMF. The repository does not give a single explicit expansion of the acronym IRMF, so the methodological distinction is firmer than the nomenclature.
    knowledge_ids:
      - claim-imf-irmf-local-estimator-distinction
      - method-linear-recursive-imf
      - method-robust-recursive-irmf
    evidence:
      - source_id: src-repo-readme
        locator: README.md, lines 44–118 and 152–159
      - source_id: src-robust-gd-note
        locator: experiments/robust-gradient-descent/ROBUST_GRADIENT_DESCENT.md, lines 404–426
      - source_id: src-tex-gd-irmf-review
        locator: overleaf/gd_irmf_review.tex, lines 19–58 and 105–164
    confidence:
      level: high
      score: 0.94
      rationale: The estimator and recursion are explicit; only the acronym's formal expansion is ambiguous.
    gaps:
      - No reviewed source provides a normative one-sentence IMF-versus-IRMF definition.

  - id: benchmark-02-linear-only-claims
    question: Which claims apply only to linear filtering?
    answer: >-
      IMF.pdf enters a section explicitly devoted to local linear smoothing after fixing quadratic loss. The fixed matrices W_k, residual operators A_k, composite operators calligraphic W_k, linear component/error identities, covariance propagation, operator norms, and regular-wrap commutativity are linear-only. The exact Fourier multipliers, impulse-response energies, DC-gain calculation, and exact energy calibration in the diagnostics are also linear-only. The sequential residual recursion and the idea of a local contrast are not linear-only. Robust recursion is data-dependent and nonlinear, so it needs bootstrap, Jacobian, or sandwich approximations rather than direct reuse of the fixed-operator formulas.
    knowledge_ids:
