  - id: benchmark-03-lemma-2-5
    question: What does Lemma 2.5 establish, and what does it not establish?
    answer: >-
      As rendered, page 5 separately defines ordinary W^(k) and calligraphic composite 𝒲^(k)=W^(k)A^(k−1). Page 6 prints Lemma 2.5 with ordinary W, asserting only (W^(k)W^(k)ᵀ)_tt asymptotic-order (n h_k)^−1. With the extra white-noise assumption Var(epsilon)=sigma²I, this gives the pointwise variance order for the single-pass error W_k epsilon. It does not establish a rate for the composite recursive error 𝒲_k epsilon, robust recursion, equality or a common stage constant, realized RMSE, global L2 or sup error, finite-sample equality, or uniformity in t, k, or h. It has no proof. The internal theory audit, review, executive summary, and TeX scaling report instead transcribe the lemma with calligraphic 𝒲; that secondary reading contradicts the visible primary PDF. A missing-calligraphic-glyph typo is possible authorial intent, but cannot be assumed.
