  - id: benchmark-10-resolving-experiments
    question: Which experiments could resolve the most important open questions?
    answer: >-
      The highest-value next study is a full recursive target-alignment experiment comparing the clean same-contrast robust target with a large-Monte-Carlo expected-noisy-loss target at every stage. Next, compare robust parametric-bootstrap and numerical-Jacobian/sandwich energy scales using at least 200 calibration replicates and held-out seeds. Replace the oracle H rule with a prespecified training/test study of deployable scale estimators over H/sigma. Run a matched factorial study crossing method, n, signal shape, kernel formula, boundary, window schedule, contamination law/probability/scale, and H on identical draws. Calibrate sup error separately with stagewise or simultaneous quantiles. Finally, test the printed single-pass Lemma 2.5 rate and any proposed composite-operator correction separately over increasing n, h, stage, and position; simulation can falsify or delimit an order claim but cannot replace its missing proof.
    knowledge_ids:
      - method-robust-bootstrap-energy-scaling
      - claim-clean-same-contrast-target-not-population
      - claim-h-selection-oracle-grid
      - claim-lemma-2-5-plain-w
