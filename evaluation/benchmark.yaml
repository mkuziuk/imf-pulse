  - id: benchmark-04-first-recursive-error
    question: Why is the first recursive IMF error larger?
    answer: >-
      For the implemented linear filter, stage 1 transmits noise through W_1 with no previous residual factors. Every later stage transmits it through W_k times the product of all preceding (I−W_j) factors. Stage 1 is a low-pass/scaling output with DC gain one; later stages remove DC and behave as lower-energy band-pass details. Bandwidth scaling removes the leading h_k^−1/2 change but not this stage-specific operator energy. The exact finite-n profile gives scaled recursive RMS 0.0201816 at stage 1 versus a stages-2–9 mean of 0.0067761, ratio 2.978. Five thousand Gaussian trials reproduce the pattern, and reflect boundaries amplify but do not create it. For robust filtering, Gaussian-only and contaminated Monte Carlo show the same qualitative pattern, but no exact fixed-operator theorem applies. “Larger” here concerns the bandwidth-scaled stage-one/tail contrast; the first raw RMS is not the largest of all nine stages.
    knowledge_ids:
      - claim-first-recursive-error-operator-energy
      - relationship-exact-linear-supports-first-error
      - relationship-linear-mc-reproduces-operator-profile
    evidence:
      - source_id: src-linear-operator-exact
        locator: research/first-imf-recursive-error/diagnostics/linear_operator_exact.csv, rows 2–10
      - source_id: src-diagnostics-summary
        locator: research/first-imf-recursive-error/diagnostics/summary.json, /linear_exact
      - source_id: src-linear-monte-carlo
        locator: research/first-imf-recursive-error/diagnostics/linear_monte_carlo.csv, rows 2–19
      - source_id: src-boundary-monte-carlo
        locator: research/first-imf-recursive-error/diagnostics/recursive_boundary_monte_carlo.csv, rows 2–19
    confidence:
      level: high
      score: 0.99
      rationale: Exact discrete algebra, stored-output reproduction, Monte Carlo, and boundary ablation agree.
    gaps:
      - Constants are specific to the current kernel, windows, n, covariance, and boundary.
      - The robust explanation remains empirical and locally linearized rather than proved.

  - id: benchmark-05-single-pass-vs-recursive
    question: How do single-pass and recursive errors differ?
    answer: >-
      Single-pass error d_k applies only the stage-k smoother to the original clean/noisy pair; in the linear case d_k=W_k epsilon. Recursive component error e_k measures the component actually extracted after previous stages changed the residual; linearly, e_1=W_1 epsilon and e_k=W_k(I−W_(k−1))…(I−W_1)epsilon for k>1. They coincide at stage 1. Single-pass bandwidth-scaled RMS is nearly flat in the exact profile, while recursive error has a high first stage and a lower band-pass plateau. For robust filtering, d_k is the difference between two nonlinear one-step fits and cannot be reduced to W_k epsilon.
    knowledge_ids:
      - claim-recursive-and-single-pass-errors-differ
      - method-geometric-bandwidth-scaling
    evidence:
