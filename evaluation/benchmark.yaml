  - id: benchmark-07-robustness-parameter
    question: How is the robustness parameter selected?
    answer: >-
      The tuning prototype evaluates H/sigma in {0.25, 0.5, 1, 2} and scores candidates against the clean decomposition computed with the same H. The stored synthetic run selects H=2 sigma, the largest grid value. Downstream gd_irmf and real-vs-calculated notebooks then fix H=2 sigma—0.4 when sigma=0.2 and 0.8 when sigma=0.4—across all recursive stages. The draft only says H should be of the same order as the pre-contamination noise scale. This is an oracle-style synthetic tuning convention, not a validated deployable, data-driven selector.
    knowledge_ids:
      - claim-h-selection-oracle-grid
      - claim-h-fixed-downstream
      - relationship-fixed-h-depends-on-oracle-grid
    evidence:
      - source_id: src-repo-readme
        locator: README.md, lines 109–118
